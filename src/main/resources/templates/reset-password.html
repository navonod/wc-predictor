<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - WC Predictor 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body >
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-5">
                <div class="text-center mb-4"><h2>WC Predictor 2026</h2></div>

                <div th:if="${success}" class="alert alert-success">
                    <span th:text="${message}"></span>
                    <a href="/login" class="btn btn-primary btn-sm ms-3">Go to Login</a>
                </div>
                <div th:if="${error}" class="alert alert-danger" th:text="${message}"></div>

                <div class="card shadow" th:if="${token != null}">
                    <div class="card-body p-4">
                        <h4 class="card-title text-center mb-4">Set New Password</h4>
                        <form method="post" th:action>
                            <input type="hidden" name="token" th:value="${token}">
                            <div class="mb-3">
                                <label class="form-label">New Password</label>
                                <input type="password" class="form-control" name="password" required minlength="6">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Confirm Password</label>
                                <input type="password" class="form-control" name="confirmPassword" required minlength="6">
                            </div>
                            <button type="submit" class="btn btn-primary w-100 submit-btn">Reset Password</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const form = document.querySelector('form');
        if (form) {
            form.addEventListener('submit', function() {
                const btn = this.querySelector('.submit-btn');
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Resetting...';
            });
        }
    </script>
</body>
</html>
