<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard - WC Predictor 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-trophy-fill"></i> WC Predictor 2026</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/predict">Predictions</a></li>
                    <li class="nav-item"><a class="nav-link" href="/simulate">Simulator</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/leaderboard">Leaderboard</a></li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link text-warning" href="/admin">Admin</a>
                    </li>
                </ul>
                <span class="navbar-text" sec:authentication="name"></span>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-trophy"></i> Leaderboard</h2>
            <form method="get" action="/leaderboard" class="d-flex gap-2" th:if="${!pools.isEmpty()}">
                <select name="poolId" class="form-select form-select-sm" style="width:auto" onchange="this.form.submit()">
                    <option value="">All Players</option>
                    <option th:each="p : ${pools}" th:value="${p.id}"
                            th:text="${p.name}"
                            th:selected="${selectedPool != null && selectedPool.id == p.id}"></option>
                </select>
            </form>
        </div>

        <div th:if="${leaderboard == null or leaderboard.isEmpty()}" class="alert alert-info">
            No players have registered yet.
        </div>

        <div class="table-responsive" th:if="${leaderboard != null and !leaderboard.isEmpty()}">
            <table class="table table-striped table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Player</th>
                        <th class="text-end">Match Points</th>
                        <th class="text-end">Award Points</th>
                        <th class="text-end">Group Points</th>
                        <th class="text-end">Total</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="entry, iterStat : ${leaderboard}" th:classappend="${iterStat.index == 0} ? 'table-warning' : (${iterStat.index == 1} ? 'table-secondary' : (${iterStat.index == 2} ? 'table-info' : ''))">
                        <td>
                            <span th:if="${iterStat.index == 0}" class="fs-4"><i class="bi bi-trophy-fill text-warning"></i></span>
                            <span th:if="${iterStat.index == 1}" class="fs-4"><i class="bi bi-trophy-fill text-secondary"></i></span>
                            <span th:if="${iterStat.index == 2}" class="fs-4"><i class="bi bi-trophy-fill text-info"></i></span>
                            <span th:if="${iterStat.index > 2}" th:text="${iterStat.index + 1}"></span>
                        </td>
                        <td th:text="${entry.displayName}"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(entry.matchPoints, 0, 'COMMA', 1, 'POINT')}"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(entry.awardPoints, 0, 'COMMA', 1, 'POINT')}"></td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(entry.groupPoints, 0, 'COMMA', 1, 'POINT')}"></td>
                        <td class="text-end fw-bold" th:text="${#numbers.formatDecimal(entry.totalPoints, 0, 'COMMA', 1, 'POINT')}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
