<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Tournament - WC Predictor 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-trophy-fill"></i> WC Predictor 2026</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/predict">Predictions</a></li>
                    <li class="nav-item"><a class="nav-link" href="/simulate">Simulator</a></li>
                    <li class="nav-item"><a class="nav-link" href="/leaderboard">Leaderboard</a></li>
                    <li class="nav-item"><a class="nav-link text-warning" href="/admin">Admin</a></li>
                </ul>
                <span class="navbar-text" sec:authentication="name"></span>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4"><i class="bi bi-check-circle"></i> Score Tournament Predictions
            <span th:if="${target != null && target.nickname != null}">: <span th:text="${target.nickname}"></span></span>
        </h2>

        <div class="d-flex justify-content-end mb-3">
            <select class="form-select form-select-sm" style="width:auto" onchange="if(this.value) location=this.value">
                <option value="" selected>Select a player...</option>
                <option th:each="u : ${allUsers}"
                        th:value="'/predict/user/' + ${u.id} + '/tournament/score'"
                        th:text="${u.nickname}" th:selected="${u.id == target.id}"></option>
            </select>
        </div>

        <div class="alert alert-info small" th:if="${prediction == null}">
            This user has not submitted tournament predictions yet.
        </div>

        <div th:if="${prediction != null}">
            <form method="post" th:action="@{/predict/user/{userId}/tournament/score(userId=${target.id})}">
            <th:block th:replace="~{fragments/tournament-score-table :: tournament-score-table(prediction=${prediction}, actual=${actual}, settings=${settings}, isAdmin=${true}, target=${target})}"></th:block>
            <div class="d-flex justify-content-between align-items-center mt-3 mb-5">
                <a th:href="@{/predict/user/{userId}/tournament(userId=${target.id})}" class="btn btn-outline-secondary">Back</a>
            </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
