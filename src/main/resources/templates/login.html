<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WC Predictor 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body >
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-5">
                <div class="text-center mb-4">
                    <h1 class="display-4"><i class="bi bi-trophy-fill"></i></h1>
                    <h2>WC Predictor 2026</h2>
                    <p class="text-muted">Predict. Compete. Win.</p>
                </div>

                <div th:if="${param.error}" class="alert alert-danger">Invalid email or password.</div>
                <div th:if="${param.logout}" class="alert alert-info">You have been logged out.</div>
                <div th:if="${param.registered}" class="alert alert-success">Registration successful! Check your email to confirm your account, then log in.</div>
                <div th:if="${param.confirmed}" class="alert alert-success">Account confirmed! You can now log in.</div>

                <div class="card shadow">
                    <div class="card-body p-4">
                        <h4 class="card-title text-center mb-4">Sign In</h4>
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label">Email</label>
                                <input type="email" class="form-control" id="username" name="username" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="remember-me" name="remember-me">
                                <label class="form-check-label" for="remember-me">Remember me</label>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 submit-btn">Sign In</button>
                        </form>
                    </div>
                    <div class="card-footer text-center">
                        <a href="/register" class="text-decoration-none">Create an account</a>
                        &middot;
                        <a href="/forgot-password" class="text-decoration-none">Forgot password?</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelector('form').addEventListener('submit', function() {
            const btn = this.querySelector('.submit-btn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Signing in...';
        });
    </script>
</body>
</html>
