<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="match-card(match, score, locked, isSelf, compact, actual, points)">
    <div class="card shadow-sm match-card" th:classappend="${compact != null && compact} ? 'h-100'">
        <div class="card-header text-muted small py-1">
            <span th:text="${match.matchNumber}"></span>
            <span th:if="${match.groupLetter != null}">&middot; Gr <span th:text="${match.groupLetter}"></span></span>
            <span>&middot; </span><span th:text="${#temporals.format(match.matchDate, 'MMM d, HH:mm')}"></span>
            <span th:if="${match.venue != null}">&middot; <span th:text="${match.venue}"></span></span>
        </div>
        <div class="card-body" th:classappend="${compact != null && compact} ? 'py-2' : 'py-3'">
            <!-- Played match: show prediction + actual result -->
            <div th:if="${actual != null}" class="text-center">
                <div class="d-flex align-items-center justify-content-center gap-1 flex-nowrap small">
                    <span class="team-name text-end fw-bold d-none d-md-inline" th:if="${!compact}" th:text="${match.team1?.name}"></span>
                    <span class="d-none d-md-inline" th:if="${compact != null && compact}" th:text="${match.team1?.name}"></span>
                    <span class="d-md-none fw-bold" th:text="${match.team1?.countryCode}"></span>
                    <span class="fw-bold mx-1" th:if="${score != null}" th:text="${score[0]}"></span>
                    <span class="text-muted mx-1" th:if="${score == null}">-</span>
                    <span class="text-muted">&ndash;</span>
                    <span class="fw-bold mx-1" th:if="${score != null}" th:text="${score[1]}"></span>
                    <span class="text-muted mx-1" th:if="${score == null}">-</span>
                    <span class="team-name fw-bold d-none d-md-inline" th:if="${!compact}" th:text="${match.team2?.name}"></span>
                    <span class="d-none d-md-inline" th:if="${compact != null && compact}" th:text="${match.team2?.name}"></span>
                    <span class="d-md-none fw-bold" th:text="${match.team2?.countryCode}"></span>
                </div>
                <div class="d-flex align-items-center justify-content-center gap-1 flex-nowrap small mt-1 text-muted">
                    <span class="small">Actual: </span>
                    <span class="fw-bold" th:text="${actual[0]}"></span>
                    <span>&ndash;</span>
                    <span class="fw-bold" th:text="${actual[1]}"></span>
                </div>
            </div>
            <!-- Locked but not played -->
            <div th:if="${locked && actual == null}">
                <div class="d-flex align-items-center justify-content-center gap-1 flex-nowrap"
                     th:classappend="${compact != null && compact} ? 'small'">
                    <span class="team-name text-end fw-bold d-none d-md-inline" th:if="${!compact}" th:text="${match.team1?.name}"></span>
                    <span class="d-none d-md-inline" th:if="${compact != null && compact}" th:text="${match.team1?.name}"></span>
                    <span class="d-md-none fw-bold" th:text="${match.team1?.countryCode}"></span>
                    <span class="fw-bold mx-1" th:if="${score != null}" th:text="${score[0]}"></span>
                    <span class="text-muted mx-1" th:if="${score == null}">-</span>
                    <span class="text-muted">&ndash;</span>
                    <span class="fw-bold mx-1" th:if="${score != null}" th:text="${score[1]}"></span>
                    <span class="text-muted mx-1" th:if="${score == null}">-</span>
                    <span class="team-name fw-bold d-none d-md-inline" th:if="${!compact}" th:text="${match.team2?.name}"></span>
                    <span class="d-none d-md-inline" th:if="${compact != null && compact}" th:text="${match.team2?.name}"></span>
                    <span class="d-md-none fw-bold" th:text="${match.team2?.countryCode}"></span>
                </div>
            </div>
            <!-- Open for predictions -->
            <div th:unless="${locked || actual != null}">
                <div th:if="${isSelf}">
                    <div th:if="${compact != null && compact}">
                        <div class="d-flex align-items-center justify-content-center gap-1 flex-nowrap small">
                            <span class="d-none d-md-inline" th:text="${match.team1?.name}"></span>
                            <span class="d-md-none fw-bold" th:text="${match.team1?.countryCode}"></span>
                            <input type="number" class="form-control form-control-sm score-input-sm"
                                   th:id="'ss1_'+${match.id}" min="0" max="10"
                                   th:value="${score != null ? score[0] : ''}"
                                   th:attr="data-initial=${score != null ? score[0] : ''}">
                            <span class="text-muted">&ndash;</span>
                            <input type="number" class="form-control form-control-sm score-input-sm"
                                   th:id="'ss2_'+${match.id}" min="0" max="10"
                                   th:value="${score != null ? score[1] : ''}"
                                   th:attr="data-initial=${score != null ? score[1] : ''}">
                            <span class="d-none d-md-inline" th:text="${match.team2?.name}"></span>
                            <span class="d-md-none fw-bold" th:text="${match.team2?.countryCode}"></span>
                            <button type="button" class="btn btn-sm border-0 px-1 dice-btn-sm" title="Randomize"><i class="bi bi-dice-6"></i></button>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mt-1">
                            <div th:id="'smsg_'+${match.id}" class="small"></div>
                            <button type="button" class="btn btn-primary btn-sm py-0 save-btn-sm" disabled
                                    th:attr="data-match-id=${match.id}"><i class="bi bi-check"></i> Save</button>
                        </div>
                    </div>
                    <div th:unless="${compact != null && compact}">
                        <div class="d-flex align-items-center justify-content-center gap-2 flex-nowrap">
                            <span class="team-name text-end fw-bold d-none d-md-inline" th:text="${match.team1?.name}"></span>
                            <span class="team-name text-end fw-bold d-md-none" th:text="${match.team1?.countryCode}"></span>
                            <input type="number" class="form-control score-input"
                                   th:id="'s1_'+${match.id}" min="0" max="10"
                                   th:value="${score != null ? score[0] : ''}"
                                   th:attr="data-initial=${score != null ? score[0] : ''}">
                            <span class="text-muted fs-5 mx-1">&ndash;</span>
                            <input type="number" class="form-control score-input"
                                   th:id="'s2_'+${match.id}" min="0" max="10"
                                   th:value="${score != null ? score[1] : ''}"
                                   th:attr="data-initial=${score != null ? score[1] : ''}">
                            <span class="team-name fw-bold d-none d-md-inline" th:text="${match.team2?.name}"></span>
                            <span class="team-name fw-bold d-md-none" th:text="${match.team2?.countryCode}"></span>
                            <button type="button" class="btn btn-sm border-0 fs-5 px-2 dice-btn"
                                    title="Randomize this match"><i class="bi bi-dice-6"></i></button>
                            <button type="button" class="btn btn-primary btn-sm ms-1 save-btn" disabled
                                    th:attr="data-match-id=${match.id}"><i class="bi bi-check-lg"></i> Save</button>
                        </div>
                        <div class="text-end mt-1" th:id="'msg_'+${match.id}"></div>
                    </div>
                </div>
                <div th:unless="${isSelf}" class="text-center">
                    <div th:if="${actual == null}" class="text-muted small py-2">
                        <i class="bi bi-hourglass-split"></i> To Be Revealed
                    </div>
                    <div th:if="${actual != null}" class="d-flex align-items-center justify-content-center gap-1 flex-nowrap"
                         th:classappend="${compact != null && compact} ? 'small'">
                        <span class="team-name text-end fw-bold d-none d-md-inline" th:if="${!compact}" th:text="${match.team1?.name}"></span>
                        <span class="d-none d-md-inline" th:if="${compact != null && compact}" th:text="${match.team1?.name}"></span>
                        <span class="d-md-none fw-bold" th:text="${match.team1?.countryCode}"></span>
                        <span class="fw-bold fs-5" th:if="${!compact && score != null}" th:text="${score[0]}"></span>
                        <span class="fw-bold mx-1" th:if="${compact && score != null}" th:text="${score[0]}"></span>
                        <span class="text-muted fs-5" th:if="${!compact && score == null}">-</span>
                        <span class="text-muted mx-1" th:if="${compact && score == null}">-</span>
                        <span class="text-muted">&ndash;</span>
                        <span class="fw-bold fs-5" th:if="${!compact && score != null}" th:text="${score[1]}"></span>
                        <span class="fw-bold mx-1" th:if="${compact && score != null}" th:text="${score[1]}"></span>
                        <span class="text-muted fs-5" th:if="${!compact && score == null}">-</span>
                        <span class="text-muted mx-1" th:if="${compact && score == null}">-</span>
                        <span class="team-name fw-bold d-none d-md-inline" th:if="${!compact}" th:text="${match.team2?.name}"></span>
                        <span class="d-none d-md-inline" th:if="${compact != null && compact}" th:text="${match.team2?.name}"></span>
                        <span class="d-md-none fw-bold" th:text="${match.team2?.countryCode}"></span>
                    </div>
                </div>
            </div>
        </div>
        <div class="card-footer text-end small py-1">
            <span th:if="${actual != null && points != null}">
                <strong>Points: </strong>
                <span class="badge" th:text="${#numbers.formatDecimal(points, 1, 'COMMA', 1, 'POINT')}"
                      th:classappend="${points >= 3} ? 'bg-success' : (${points >= 2} ? 'bg-warning text-dark' : (${points >= 1} ? 'bg-primary' : 'bg-danger'))"></span>
            </span>
            <span th:if="${locked && actual == null}" class="badge bg-warning text-dark"><i class="bi bi-lock-fill"></i> Closed</span>
            <span th:if="${!locked && actual == null}">&nbsp;</span>
            <span th:if="${actual != null && points == null}">&nbsp;</span>
        </div>
    </div>
</th:block>
