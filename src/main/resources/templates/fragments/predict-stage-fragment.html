<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
    <div th:fragment="stage-matches">
        <div th:if="${!isSelf && !allLocked}" class="alert alert-info text-center py-4">
            <i class="bi bi-lock-fill display-4"></i>
            <h5>Predictions Locked</h5>
            <p class="mb-0">This player's predictions will be visible once all matches in this round are locked in.</p>
        </div>

        <div th:if="${isSelf || allLocked}">
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">
                <div class="col" th:each="match : ${matches}">
                    <div class="card shadow-sm h-100">
                        <div class="card-header text-muted small py-1">
                            <span th:text="${match.matchNumber}"></span>
                            <span th:if="${match.groupLetter != null}">&middot; Gr <span th:text="${match.groupLetter}"></span></span>
                            <span>&middot; </span><span th:text="${#temporals.format(match.matchDate, 'MMM d, HH:mm')}"></span>
                        </div>
                        <div class="card-body py-2">
                        <div th:if="${matchLocked[match.id]}" class="text-center">
                            <div class="d-flex align-items-center justify-content-center gap-1 flex-nowrap small">
                                <span class="d-none d-md-inline" th:text="${match.team1?.name}"></span>
                                <span class="d-md-none fw-bold" th:text="${match.team1?.countryCode}"></span>
                                <span class="fw-bold mx-1" th:if="${scores[match.id] != null}" th:text="${scores[match.id][0]}"></span>
                                <span class="text-muted mx-1" th:if="${scores[match.id] == null}">-</span>
                                <span class="text-muted">&ndash;</span>
                                <span class="fw-bold mx-1" th:if="${scores[match.id] != null}" th:text="${scores[match.id][1]}"></span>
                                <span class="text-muted mx-1" th:if="${scores[match.id] == null}">-</span>
                                <span class="d-none d-md-inline" th:text="${match.team2?.name}"></span>
                                <span class="d-md-none fw-bold" th:text="${match.team2?.countryCode}"></span>
                            </div>
                            <span class="badge bg-danger mt-1"><i class="bi bi-lock-fill"></i> Predictions closed</span>
                        </div>
                            <div th:unless="${matchLocked[match.id]}">
                                <div th:if="${isSelf}">
                                    <div>
                                        <div class="d-flex align-items-center justify-content-center gap-1 flex-nowrap small">
                                            <span class="d-none d-md-inline" th:text="${match.team1?.name}"></span>
                                            <span class="d-md-none fw-bold" th:text="${match.team1?.countryCode}"></span>
                                            <input type="number" class="form-control form-control-sm score-input-sm"
                                                   th:id="'ss1_'+${match.id}" min="0" max="10"
                                                   th:value="${scores[match.id] != null ? scores[match.id][0] : ''}"
                                                   th:attr="data-initial=${scores[match.id] != null ? scores[match.id][0] : ''}">
                                            <span class="text-muted">&ndash;</span>
                                            <input type="number" class="form-control form-control-sm score-input-sm"
                                                   th:id="'ss2_'+${match.id}" min="0" max="10"
                                                   th:value="${scores[match.id] != null ? scores[match.id][1] : ''}"
                                                   th:attr="data-initial=${scores[match.id] != null ? scores[match.id][1] : ''}">
                                            <span class="d-none d-md-inline" th:text="${match.team2?.name}"></span>
                                            <span class="d-md-none fw-bold" th:text="${match.team2?.countryCode}"></span>
                                            <button type="button" class="btn btn-sm border-0 px-1 dice-btn-sm"
                                                    title="Randomize"><i class="bi bi-dice-6"></i></button>
                                        </div>
                                        <div class="d-flex justify-content-between align-items-center mt-1">
                                            <div th:id="'smsg_'+${match.id}" class="small"></div>
                                            <button type="button" class="btn btn-primary btn-sm py-0 save-btn-sm" disabled
                                                    th:attr="data-match-id=${match.id}">
                                                <i class="bi bi-check"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <div th:unless="${isSelf}" class="text-center">
                                    <div class="d-flex align-items-center justify-content-center gap-1 flex-nowrap small">
                                        <span class="d-none d-md-inline" th:text="${match.team1?.name}"></span>
                                        <span class="d-md-none fw-bold" th:text="${match.team1?.countryCode}"></span>
                                        <span class="fw-bold mx-1" th:if="${scores[match.id] != null}" th:text="${scores[match.id][0]}"></span>
                                        <span class="text-muted mx-1" th:if="${scores[match.id] == null}">-</span>
                                        <span class="text-muted">&ndash;</span>
                                        <span class="fw-bold mx-1" th:if="${scores[match.id] != null}" th:text="${scores[match.id][1]}"></span>
                                        <span class="text-muted mx-1" th:if="${scores[match.id] == null}">-</span>
                                        <span class="d-none d-md-inline" th:text="${match.team2?.name}"></span>
                                        <span class="d-md-none fw-bold" th:text="${match.team2?.countryCode}"></span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
