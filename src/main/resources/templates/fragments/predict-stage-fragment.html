<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
    <div th:fragment="stage-matches(matches, scores, matchLocked, isSelf, allLocked)">
        <div th:if="${!isSelf && !allLocked}" class="alert alert-info text-center py-4">
            <i class="bi bi-lock-fill display-4"></i>
            <h5>Predictions Locked</h5>
            <p class="mb-0">This player's predictions will be visible once all matches in this round are locked in.</p>
        </div>

        <div th:if="${isSelf || allLocked}">
            <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">
                <div class="col" th:each="match : ${matches}">
                    <th:block th:replace="~{fragments/match-prediction-card :: match-card(match=${match}, score=${scores[match.id]}, locked=${matchLocked[match.id]}, isSelf=${isSelf}, compact=${true})}"></th:block>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
