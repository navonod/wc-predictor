<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Control - WC Predictor 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-trophy-fill"></i> WC Predictor 2026</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link active text-warning" href="/admin">Admin</a></li>
                </ul>
                <span class="navbar-text" sec:authentication="name"></span>
                <span class="badge bg-danger ms-2" th:if="${dummyTimeActive}"><i class="bi bi-cone-striped"></i> DUMMY TIME</span>
            </div>
        </div>
    </nav>

    <div class="container">
        <a href="/admin" class="btn btn-outline-secondary btn-sm mb-3"><i class="bi bi-arrow-left"></i> Back to Admin</a>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3><i class="bi bi-clock"></i> Time Control</h3>
            <span th:if="${overrideEnabled}" class="badge bg-danger fs-6"><i class="bi bi-cone-striped"></i> DUMMY TIME ACTIVE</span>
        </div>

        <p class="text-muted small" th:text="'Current effective time: ' + ${now}">
        </p>

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-dark text-white"><h5 class="mb-0">Override Time</h5></div>
            <div class="card-body">
                <form method="post" th:action="@{/admin/time/toggle}" class="row g-3 align-items-end">
                    <input type="hidden" name="enable" value="true">
                    <div class="col-md-4">
                        <label class="form-label">Dummy Time (UTC)</label>
                        <input type="datetime-local" class="form-control" name="overrideTime"
                               th:value="${overrideValue}" step="1" required>
                    </div>
                    <div class="col-md-4">
                        <button type="submit" class="btn btn-primary w-100">Set Dummy Time</button>
                    </div>
                </form>
                <form method="post" th:action="@{/admin/time/toggle}" class="mt-2" th:if="${overrideEnabled}">
                    <input type="hidden" name="enable" value="false">
                    <button type="submit" class="btn btn-outline-danger">Disable Dummy Time</button>
                </form>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-dark text-white"><h5 class="mb-0">Round Lock Status</h5></div>
            <div class="card-body p-0">
                <table class="table table-sm mb-0">
                    <thead>
                        <tr><th>Round</th><th>Earliest Kickoff (UTC)</th><th>Status</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="round : ${rounds}">
                            <td th:text="${round.description}"></td>
                            <td th:text="${lockTimes[round.name()] != null ? #temporals.format(lockTimes[round.name()], 'MMM d, yyyy HH:mm') : 'N/A'}"></td>
                            <td>
                                <span th:if="${statuses[round.name()] == 'Locked'}" class="badge bg-danger">Locked</span>
                                <span th:if="${statuses[round.name()] == 'Open'}" class="badge bg-success">Open</span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
