<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Edit Match #' + ${match.matchNumber} + ' - Admin'">Edit Match - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">WC Predictor 2026</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link active text-warning" href="/admin">Admin</a></li>
                </ul>
                <span class="navbar-text" sec:authentication="name"></span>
            </div>
        </div>
    </nav>

    <div class="container">
        <a href="/admin/matches" class="btn btn-outline-secondary btn-sm mb-3"><i class="bi bi-arrow-left"></i> Back to Matches</a>

        <div class="card shadow-sm mx-auto" style="max-width:500px">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0" th:text="'Match #' + ${match.matchNumber}"></h5>
            </div>
            <div class="card-body">
                <p class="text-muted small">
                    <span th:text="${match.round?.description}"></span>
                    <span th:if="${match.groupLetter != null}"> &middot; Group <span th:text="${match.groupLetter}"></span></span>
                    <span th:if="${match.venue != null}"> &middot; <span th:text="${match.venue}"></span></span>
                </p>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="fw-bold" th:text="${match.team1?.name != null ? match.team1.name : 'TBD'}"></span>
                    <span class="text-muted">vs</span>
                    <span class="fw-bold" th:text="${match.team2?.name != null ? match.team2.name : 'TBD'}"></span>
                </div>

                <form th:action="@{/admin/match/{id}/update-time(id=${match.id})}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Kickoff Time (UTC)</label>
                        <input type="datetime-local" class="form-control" name="kickoffTime"
                               th:value="${#temporals.format(match.matchDate, 'yyyy-MM-dd') + 'T' + #temporals.format(match.matchDate, 'HH:mm')}"
                               step="1" required>
                        <div class="form-text">All match times are stored in UTC and displayed in your local time.</div>
                    </div>

                    <div th:if="${match.team1Score != null}" class="alert alert-warning small py-2">
                        <i class="bi bi-exclamation-triangle"></i> This match has a result. Changing the time will also update the prediction lock time.
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Save Kickoff Time</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
