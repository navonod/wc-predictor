<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Standings - WC Predictor 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-trophy-fill"></i> WC Predictor 2026</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link active text-warning" href="/admin">Admin</a></li>
                </ul>
                <span class="navbar-text" sec:authentication="name"></span>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4"><i class="bi bi-table"></i> Group Stage Standings</h2>

        <div class="row">
            <div class="col-md-3 mb-4" th:each="entry : ${standings}">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">
                        <strong>Group <span th:text="${entry.key}"></span></strong>
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-sm table-striped mb-0">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Team</th>
                                    <th>P</th>
                                    <th>GD</th>
                                    <th>Pts</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="gs : ${entry.value}">
                                    <td th:text="${gs.position}"></td>
                                    <td th:text="${gs.team.name}"></td>
                                    <td th:text="${gs.played}"></td>
                                    <td><span th:if="${gs.goalDiff > 0}">+</span><span th:text="${gs.goalDiff}"></span></td>
                                    <td th:text="${gs.points}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${bestThirds != null and !bestThirds.isEmpty()}" class="card shadow-sm mb-4">
            <div class="card-header bg-info text-white"><h5 class="mb-0">Best 8 Third-Placed Teams (advance to Round of 32)</h5></div>
            <div class="card-body">
                <table class="table table-sm">
                    <thead>
                        <tr><th>#</th><th>Team</th><th>Group</th><th>Pts</th><th>GD</th><th>GF</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="gs, stat : ${bestThirds}">
                            <td th:text="${stat.index + 1}"></td>
                            <td th:text="${gs.team.name}"></td>
                            <td th:text="${gs.team.groupLetter}"></td>
                            <td th:text="${gs.points}"></td>
                            <td><span th:if="${gs.goalDiff > 0}">+</span><span th:text="${gs.goalDiff}"></span></td>
                            <td th:text="${gs.goalsFor}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div th:if="${knockoutMatches != null and !knockoutMatches.isEmpty()}" class="card shadow-sm mb-4">
            <div class="card-header bg-success text-white"><h5 class="mb-0">Round of 32</h5></div>
            <div class="card-body">
                <table class="table table-sm">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Date</th>
                            <th>Venue</th>
                            <th>Home</th>
                            <th></th>
                            <th>Away</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="m : ${knockoutMatches}">
                            <td th:text="${m.matchNumber}"></td>
                            <td th:text="${#temporals.format(m.matchDate, 'MMM d, HH:mm')}"></td>
                            <td th:text="${m.venue}"></td>
                            <td th:text="${m.team1.name}"></td>
                            <td class="text-center">vs</td>
                            <td th:text="${m.team2.name}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <a href="/admin" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> Back to Admin</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
