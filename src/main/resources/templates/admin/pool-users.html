<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - WC Predictor 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-trophy-fill"></i> WC Predictor 2026</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link active text-warning" href="/admin">Admin</a></li>
                </ul>
                <span class="navbar-text" sec:authentication="name"></span>
                <span class="badge bg-danger ms-2" th:if="${dummyTimeActive}"><i class="bi bi-cone-striped"></i> DUMMY TIME</span>
            </div>
        </div>
    </nav>

    <div class="container">
        <a href="/admin/pools" class="btn btn-outline-secondary btn-sm mb-3"><i class="bi bi-arrow-left"></i> Back to Pools</a>

        <h3 class="mb-3">Pool: <span th:text="${pool.name}"></span></h3>

        <div class="row">
            <div class="col-md-6">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-dark text-white"><h5 class="mb-0">Current Members</h5></div>
                    <div class="card-body p-0">
                        <table class="table table-sm mb-0">
                            <thead><tr><th>Name</th><th>Email</th><th></th></tr></thead>
                            <tbody>
                                <tr th:each="u : ${pool.users}">
                                    <td th:text="${u.nickname != null && !u.nickname.isBlank() ? u.nickname : (u.firstName != null ? u.firstName + ' ' + u.lastName : u.emailAddress)}"></td>
                                    <td class="text-muted small" th:text="${u.emailAddress}"></td>
                                    <td>
                                        <form method="post" th:action="@{/admin/pools/{id}/users/remove(id=${pool.id})}" class="d-inline">
                                            <input type="hidden" name="userId" th:value="${u.id}">
                                            <button type="submit" class="btn btn-sm btn-outline-danger">Remove</button>
                                        </form>
                                    </td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(pool.users)}">
                                    <td colspan="3" class="text-muted text-center">No members yet.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-dark text-white"><h5 class="mb-0">Add User</h5></div>
                    <div class="card-body p-0">
                        <table class="table table-sm mb-0">
                            <thead><tr><th>Name</th><th>Email</th><th></th></tr></thead>
                            <tbody>
                                <tr th:each="u : ${allUsers}" th:if="${!poolUserIds.contains(u.id)}">
                                    <td th:text="${u.nickname != null && !u.nickname.isBlank() ? u.nickname : (u.firstName != null ? u.firstName + ' ' + u.lastName : u.emailAddress)}"></td>
                                    <td class="text-muted small" th:text="${u.emailAddress}"></td>
                                    <td>
                                        <form method="post" th:action="@{/admin/pools/{id}/users/add(id=${pool.id})}" class="d-inline">
                                            <input type="hidden" name="userId" th:value="${u.id}">
                                            <button type="submit" class="btn btn-sm btn-outline-success">Add</button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
