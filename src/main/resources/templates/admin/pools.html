<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Pools - WC Predictor 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-trophy-fill"></i> WC Predictor 2026</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link active text-warning" href="/admin">Admin</a></li>
                </ul>
                <span class="navbar-text" sec:authentication="name"></span>
                <span class="badge bg-danger ms-2" th:if="${dummyTimeActive}"><i class="bi bi-cone-striped"></i> DUMMY TIME</span>
            </div>
        </div>
    </nav>

    <div class="container">
        <a href="/admin" class="btn btn-outline-secondary btn-sm mb-3"><i class="bi bi-arrow-left"></i> Back to Admin</a>

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-dark text-white"><h5 class="mb-0">Create Pool</h5></div>
            <div class="card-body">
                <form method="post" th:action="@{/admin/pools/create}">
                    <div class="row g-2">
                        <div class="col-md-4">
                            <input type="text" class="form-control" name="name" placeholder="Pool name" required>
                        </div>
                        <div class="col-md-5">
                            <input type="text" class="form-control" name="description" placeholder="Description (optional)">
                        </div>
                        <div class="col-md-3">
                            <button type="submit" class="btn btn-primary w-100"><i class="bi bi-plus-lg"></i> Create Pool</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <h5>Existing Pools</h5>
        <table class="table table-striped">
            <thead>
                <tr><th>Name</th><th>Users</th><th>Created</th><th>Actions</th></tr>
            </thead>
            <tbody>
                <tr th:each="pool : ${pools}">
                    <td th:text="${pool.name}"></td>
                    <td th:text="${#lists.size(pool.users)}"></td>
                    <td th:text="${#temporals.format(pool.createdAt, 'MMM d, yyyy')}"></td>
                    <td>
                        <a th:href="@{/admin/pools/{id}/users(id=${pool.id})}" class="btn btn-sm btn-outline-primary">Manage Users</a>
                        <form method="post" th:action="@{/admin/pools/delete}" class="d-inline"
                              onsubmit="return confirm('Delete this pool?')">
                            <input type="hidden" name="id" th:value="${pool.id}">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${pools == null or pools.isEmpty()}">
                    <td colspan="4" class="text-muted text-center">No pools yet.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
