<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Matches - Admin - WC Predictor 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">WC Predictor 2026</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link active text-warning" href="/admin">Admin</a></li>
                </ul>
                <span class="navbar-text" sec:authentication="name"></span>
                <span class="badge bg-danger ms-2" th:if="${dummyTimeActive}"><i class="bi bi-cone-striped"></i> DUMMY TIME</span>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4"><i class="bi bi-calendar-event-fill"></i> Manage Matches</h2>

        <div th:each="entry : ${matchesByRound}" class="mb-4">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5 th:text="${entry.key.description}"></h5>
                <div>
                    <form method="post" th:action="@{/admin/matches/lock-round}" class="d-inline">
                        <input type="hidden" name="roundType" th:value="${entry.key.name()}">
                        <button type="submit" class="btn btn-warning btn-sm">Lock All</button>
                    </form>
                    <form method="post" th:action="@{/admin/matches/unlock-round}" class="d-inline">
                        <input type="hidden" name="roundType" th:value="${entry.key.name()}">
                        <button type="submit" class="btn btn-outline-success btn-sm">Unlock All</button>
                    </form>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-sm table-striped">
                    <thead class="table-dark">
                        <tr>
                            <th>#</th><th>Group</th><th>Date</th><th>Home</th><th>Score</th><th>Away</th><th>Venue</th><th>Locked</th><th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="match : ${entry.value}">
                            <td th:text="${match.matchNumber}"></td>
                            <td th:text="${match.groupLetter}"></td>
                            <td th:text="${#temporals.format(match.matchDate, 'MMM dd HH:mm')}"></td>
                            <td>
                                <span th:text="${match.team1?.name}"></span>
                                <small class="text-muted" th:text="${match.team1?.countryCode}"></small>
                            </td>
                            <td>
                                <span th:if="${match.team1Score != null}" th:text="${match.team1Score + ' - ' + match.team2Score}"></span>
                                <span th:if="${match.team1Score == null}" class="text-muted">vs</span>
                            </td>
                            <td>
                                <span th:text="${match.team2?.name}"></span>
                                <small class="text-muted" th:text="${match.team2?.countryCode}"></small>
                            </td>
                            <td class="small text-muted" th:text="${match.venue}"></td>
                            <td>
                                <span th:if="${match.predictionsLocked}" class="badge bg-danger">Locked</span>
                                <span th:if="${!match.predictionsLocked}" class="badge bg-success">Open</span>
                            </td>
                            <td>
                                <button class="btn btn-outline-primary btn-sm" data-bs-toggle="modal"
                                        th:attr="data-bs-target='#resultModal' + ${match.id}">Set Result</button>

                                <div class="modal fade" th:id="'resultModal' + ${match.id}" tabindex="-1">
                                    <div class="modal-dialog modal-sm">
                                        <div class="modal-content">
                                            <form method="post" th:action="@{/admin/matches/set-result}">
                                                <input type="hidden" name="matchId" th:value="${match.id}">
                                                <div class="modal-header">
                                                    <h5 class="modal-title" th:text="'Match #' + ${match.matchNumber}"></h5>
                                                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                                                </div>
                                                <div class="modal-body">
                                                    <div class="row">
                                                        <div class="col-5">
                                                            <label class="form-label small" th:text="${match.team1?.name}"></label>
                                                            <input type="number" class="form-control" name="team1Score" th:value="${match.team1Score}" min="0">
                                                        </div>
                                                        <div class="col-2 text-center pt-4">-</div>
                                                        <div class="col-5">
                                                            <label class="form-label small" th:text="${match.team2?.name}"></label>
                                                            <input type="number" class="form-control" name="team2Score" th:value="${match.team2Score}" min="0">
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="modal-footer">
                                                    <button type="submit" class="btn btn-primary">Save</button>
                                                </div>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <a href="/admin" class="btn btn-outline-secondary mt-3">Back to Dashboard</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
