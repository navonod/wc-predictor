<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Tournaments - WC Predictor 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-trophy-fill"></i> WC Predictor 2026</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link active text-warning" href="/admin">Admin</a></li>
                </ul>
                <span class="navbar-text" sec:authentication="name"></span>
            </div>
        </div>
    </nav>

    <div class="container">
        <a href="/admin" class="btn btn-outline-secondary btn-sm mb-3"><i class="bi bi-arrow-left"></i> Back to Admin</a>

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-dark text-white"><h5 class="mb-0">Create Tournament</h5></div>
            <div class="card-body">
                <form method="post" th:action="@{/admin/tournaments/create}">
                    <div class="row g-2">
                        <div class="col-md-4">
                            <input type="text" class="form-control" name="name" placeholder="Tournament name" required>
                        </div>
                        <div class="col-md-5">
                            <input type="text" class="form-control" name="description" placeholder="Description (optional)">
                        </div>
                        <div class="col-md-3">
                            <button type="submit" class="btn btn-primary w-100"><i class="bi bi-plus-lg"></i> Create</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <h5>Existing Tournaments</h5>
        <table class="table table-striped">
            <thead>
                <tr><th>Name</th><th>Description</th><th>Created</th><th></th></tr>
            </thead>
            <tbody>
                <tr th:each="t : ${tournaments}">
                    <td th:text="${t.name}"></td>
                    <td th:text="${t.description}"></td>
                    <td th:text="${#temporals.format(t.createdAt, 'MMM d, yyyy')}"></td>
                    <td>
                        <a th:href="@{/admin/tournaments/{id}/import(id=${t.id})}" class="btn btn-sm btn-outline-success">Import Schedule</a>
                        <form method="post" th:action="@{/admin/tournaments/delete}" class="d-inline"
                              onsubmit="return confirm('Delete this tournament?')">
                            <input type="hidden" name="id" th:value="${t.id}">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${tournaments == null or tournaments.isEmpty()}">
                    <td colspan="4" class="text-muted text-center">No tournaments yet.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
