<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Round Predictions - WC Predictor 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-trophy-fill"></i> WC Predictor 2026</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/predict">Predictions</a></li>
                    <li class="nav-item"><a class="nav-link" href="/simulate">Simulator</a></li>
                    <li class="nav-item"><a class="nav-link" href="/leaderboard">Leaderboard</a></li>
                </ul>
                <span class="navbar-text" sec:authentication="name"></span>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4"><i class="bi bi-calendar-check"></i> <span th:text="${round?.description}"></span> Predictions</h2>

        <div th:if="${locked == true}" class="alert alert-warning">
            <i class="bi bi-lock-fill"></i> Predictions for this round are locked.
        </div>

        <form method="post" th:action th:if="${locked == null or !locked}">
            <div class="table-responsive">
                <table class="table table-striped">
                    <thead class="table-dark">
                        <tr>
                            <th>Match</th>
                            <th>Group</th>
                            <th>Date</th>
                            <th>Home</th>
                            <th></th>
                            <th>Away</th>
                            <th>Venue</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="match : ${matches}">
                            <td th:text="${match.matchNumber}"></td>
                            <td th:text="${match.groupLetter}"></td>
                            <td th:text="${#temporals.format(match.matchDate, 'MMM dd, HH:mm')}"></td>
                            <td>
                                <span th:text="${match.team1?.name}"></span>
                                <span class="text-muted small" th:text="${match.team1?.countryCode}"></span>
                            </td>
                            <td>
                                <input type="number" class="form-control form-control-sm d-inline" style="width:60px"
                                       th:name="'score_' + ${match.id} + '_1'"
                                       th:value="${predictions[match.id]?.team1Score}"
                                       min="0" max="99" placeholder="-">
                                <span class="mx-1">vs</span>
                                <input type="number" class="form-control form-control-sm d-inline" style="width:60px"
                                       th:name="'score_' + ${match.id} + '_2'"
                                       th:value="${predictions[match.id]?.team2Score}"
                                       min="0" max="99" placeholder="-">
                            </td>
                            <td>
                                <span th:text="${match.team2?.name}"></span>
                                <span class="text-muted small" th:text="${match.team2?.countryCode}"></span>
                            </td>
                            <td class="small text-muted" th:text="${match.venue}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="text-center mb-5">
                <a href="/predict" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Predictions</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
