<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Predictions - WC Predictor 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-trophy-fill"></i> WC Predictor 2026</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/predict">Predictions</a></li>
                    <li class="nav-item"><a class="nav-link" href="/simulate">Simulator</a></li>
                    <li class="nav-item"><a class="nav-link" href="/leaderboard">Leaderboard</a></li>
                </ul>
                <span class="navbar-text" sec:authentication="name"></span>
                <span class="badge bg-danger ms-2" th:if="${dummyTimeActive}"><i class="bi bi-cone-striped"></i> DUMMY TIME</span>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex align-items-center gap-2 mb-3">
            <a href="/predict" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Back</a>
            <a th:href="@{/player/{id}(id=${target.id})}" class="text-decoration-none"><h3 class="mb-0" th:text="${target.nickname != null && !target.nickname.isBlank() ? target.nickname : (target.firstName != null ? target.firstName + ' ' + target.lastName : target.emailAddress)}"></h3></a>
        </div>

        <div class="d-flex align-items-center gap-3 mb-4">
            <label class="form-label mb-0"><strong>Group:</strong></label>
            <select class="form-select form-select-sm" style="width:auto" onchange="location = '/predict/user/' + document.getElementById('userId').value + '/group/' + this.value + '?round=' + document.getElementById('roundInput').value">
                <option th:each="g : ${groups}" th:value="${g}" th:text="${g}"
                        th:selected="${#strings.equals(g, group)}"></option>
            </select>
        </div>

        <input type="hidden" id="userId" th:value="${target.id}">
        <input type="hidden" id="roundInput" th:value="${selectedRound}">

        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" th:text="${error}">
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${!isSelf && !allLocked}" class="alert alert-info text-center py-4">
            <i class="bi bi-lock-fill display-4"></i>
            <h5>Predictions Locked</h5>
            <p class="mb-0">This player's predictions will be visible once all matches in this round are locked in.</p>
        </div>

        <div th:if="${isSelf || allLocked}">
            <ul class="nav nav-tabs mb-4">
                <li class="nav-item" th:each="r : ${rounds}">
                    <a class="nav-link" th:classappend="${selectedRound == r} ? 'active'"
                       th:href="@{/predict/user/{userId}/group/{group}(userId=${target.id}, group=${group}, round=${r})}">
                        <span th:if="${r == 'GROUP_MD1'}">Matchday 1</span>
                        <span th:if="${r == 'GROUP_MD2'}">Matchday 2</span>
                        <span th:if="${r == 'GROUP_MD3'}">Matchday 3</span>
                    </a>
                </li>
            </ul>

            <input type="hidden" id="group_letter" th:value="${group}">

            <div th:each="match : ${matches}" th:if="${match.round.name() == selectedRound}">
                <div class="row justify-content-center mb-3">
                    <div class="col-lg-10">
                        <th:block th:replace="~{fragments/match-prediction-card :: match-card(match=${match}, score=${scores[match.id]}, locked=${matchLocked[match.id]}, isSelf=${isSelf}, compact=${false}, actual=${actual[match.id]}, points=${points[match.id]})}"></th:block>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${matches == null or matches.isEmpty()}" class="text-center text-muted py-5">
            <p>No matches found for this group.</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/match-predictions.js"></script>
</body>
</html>
