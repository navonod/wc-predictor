<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player - WC Predictor 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-trophy-fill"></i> WC Predictor 2026</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/predict">Predictions</a></li>
                    <li class="nav-item"><a class="nav-link" href="/simulate">Simulator</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/leaderboard">Leaderboard</a></li>
                </ul>
                <span class="navbar-text" sec:authentication="name"></span>
            </div>
        </div>
    </nav>

    <div class="container">
        <a href="/leaderboard" class="btn btn-outline-secondary btn-sm mb-3"><i class="bi bi-arrow-left"></i> Back to Leaderboard</a>

        <h2 class="mb-4">
            <span th:text="${player.nickname != null && !player.nickname.isBlank() ? player.nickname : (player.firstName != null ? player.firstName + ' ' + player.lastName : 'Player')}"></span>
        </h2>

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Profile</h5>
                <button th:if="${isAdmin || isSelf}" id="edit-btn" class="btn btn-outline-light btn-sm" title="Edit profile"><i class="bi bi-pencil"></i></button>
                <button id="save-btn" class="btn btn-success btn-sm d-none"><i class="bi bi-check-lg"></i> Save</button>
            </div>
            <div class="card-body">
                <form method="post" th:action="@{/player/{id}/edit(id=${player.id})}" id="profile-form">
                    <div class="mb-3">
                        <label class="form-label text-muted small">Nickname</label>
                        <input type="text" class="form-control" name="nickname" th:value="${player.nickname}" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small">First Name</label>
                        <input type="text" class="form-control" name="firstName" th:value="${player.firstName}" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small">Last Name</label>
                        <input type="text" class="form-control" name="lastName" th:value="${player.lastName}" disabled>
                    </div>
                    <div th:if="${isAdmin || isSelf}" class="mb-3">
                        <label class="form-label text-muted small">Email</label>
                        <input type="text" class="form-control" th:value="${player.emailAddress}" disabled>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small">Joined</label>
                        <input type="text" class="form-control" th:value="${player.createdAt != null ? #temporals.format(player.createdAt, 'MMM d, yyyy') : 'Unknown'}" disabled>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-dark text-white"><h5 class="mb-0">Pools</h5></div>
            <div class="card-body p-0">
                <table class="table table-sm mb-0" th:if="${!player.pools.isEmpty()}">
                    <thead><tr><th>Pool Name</th><th>Players</th></tr></thead>
                    <tbody>
                        <tr th:each="pool : ${player.pools}">
                            <td th:text="${pool.name}"></td>
                            <td th:text="${#lists.size(pool.users)}"></td>
                        </tr>
                    </tbody>
                </table>
                <p class="text-muted text-center py-3 mb-0" th:if="${player.pools.isEmpty()}">Not in any pools yet.</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const editBtn = document.getElementById('edit-btn');
        const saveBtn = document.getElementById('save-btn');
        if (editBtn && saveBtn) {
            editBtn.addEventListener('click', function() {
                document.querySelectorAll('#profile-form input[name]').forEach(inp => {
                    if (inp.name !== '') inp.disabled = false;
                });
                editBtn.classList.add('d-none');
                saveBtn.classList.remove('d-none');
            });

            document.getElementById('profile-form').addEventListener('submit', function() {
                saveBtn.disabled = true;
                saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Saving...';
            });
        }
    </script>
</body>
</html>
