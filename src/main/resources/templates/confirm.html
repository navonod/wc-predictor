<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Account - WC Predictor 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body >
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-5 text-center">
                <div class="card shadow">
                    <div class="card-body p-5">
                        <div th:if="${success}">
                            <h3 class="text-success mb-3"><i class="bi bi-check-circle-fill"></i></h3>
                            <p th:text="${message}"></p>
                            <a href="/login" class="btn btn-primary">Go to Login</a>
                        </div>
                        <div th:if="${error}">
                            <h3 class="text-danger mb-3"><i class="bi bi-x-circle-fill"></i></h3>
                            <p th:text="${message}"></p>
                            <a href="/register" class="btn btn-outline-primary">Register Again</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
