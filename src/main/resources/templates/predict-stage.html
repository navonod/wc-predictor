<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage Predictions - WC Predictor 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css">
    <style>
        .score-input { width: 72px !important; text-align: center; font-size: 1.1rem; font-weight: 700; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-trophy-fill"></i> WC Predictor 2026</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/predict">Predictions</a></li>
                    <li class="nav-item"><a class="nav-link" href="/simulate">Simulator</a></li>
                    <li class="nav-item"><a class="nav-link" href="/leaderboard">Leaderboard</a></li>
                </ul>
                <span class="navbar-text" sec:authentication="name"></span>
                <span class="badge bg-danger ms-2" th:if="${dummyTimeActive}"><i class="bi bi-cone-striped"></i> DUMMY TIME</span>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex align-items-center gap-2 mb-4">
            <a href="#" onclick="history.back(); return false;" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Back</a>
            <a th:href="@{/player/{id}(id=${target.id})}" class="text-decoration-none"><h3 class="mb-0" th:text="${target.nickname != null && !target.nickname.isBlank() ? target.nickname : (target.firstName != null ? target.firstName + ' ' + target.lastName : target.emailAddress)}"></h3></a>
        </div>

        <h4 class="mb-3" th:text="${round.description}"></h4>

        <div th:if="${!isSelf && !allLocked}" class="alert alert-info text-center py-4">
            <i class="bi bi-lock-fill display-4"></i>
            <h5>Predictions Locked</h5>
            <p class="mb-0">This player's predictions will be visible once all matches in this round are locked in.</p>
        </div>

        <div th:if="${isSelf || allLocked}">
            <div th:each="match : ${matches}">
                <div class="row justify-content-center mb-3">
                    <div class="col-lg-10">
                        <div class="card shadow-sm">
                            <div class="card-header text-muted small py-1">
                                Match <span th:text="${match.matchNumber}"></span> &middot;
                                <span th:text="${#temporals.format(match.matchDate, 'MMM d, HH:mm')}"></span>
                                <span th:if="${match.groupLetter != null}">&middot; Group <span th:text="${match.groupLetter}"></span></span>
                                <span th:if="${match.venue != null}">&middot; <span th:text="${match.venue}"></span></span>
                            </div>
                            <div class="card-body py-3">
                                <div th:if="${matchLocked[match.id]}" class="text-center py-2">
                                    <div class="d-flex align-items-center justify-content-center gap-2 flex-nowrap">
                                        <span class="fw-bold d-none d-md-inline" th:text="${match.team1?.name}"></span>
                                        <span class="fw-bold d-md-none" th:text="${match.team1?.countryCode}"></span>
                                        <span class="fw-bold" th:if="${scores[match.id] != null}" th:text="${scores[match.id][0]}"></span>
                                        <span class="text-muted" th:if="${scores[match.id] == null}">-</span>
                                        <span class="text-muted">&ndash;</span>
                                        <span class="fw-bold" th:if="${scores[match.id] != null}" th:text="${scores[match.id][1]}"></span>
                                        <span class="text-muted" th:if="${scores[match.id] == null}">-</span>
                                        <span class="fw-bold d-none d-md-inline" th:text="${match.team2?.name}"></span>
                                        <span class="fw-bold d-md-none" th:text="${match.team2?.countryCode}"></span>
                                    </div>
                                </div>
                                <div th:unless="${matchLocked[match.id]}">
                                    <div th:if="${isSelf}">
                                        <div>
                                            <div class="d-flex align-items-center justify-content-center gap-2 flex-nowrap">
                                                <span class="fw-bold d-none d-md-inline" th:text="${match.team1?.name}"></span>
                                                <span class="fw-bold d-md-none" th:text="${match.team1?.countryCode}"></span>
                                                <input type="number" class="form-control score-input"
                                                       th:id="'s1_'+${match.id}" min="0" max="10"
                                                       th:value="${scores[match.id] != null ? scores[match.id][0] : ''}"
                                                       th:attr="data-initial=${scores[match.id] != null ? scores[match.id][0] : ''}">
                                                <span class="text-muted fs-5 mx-1">&ndash;</span>
                                                <input type="number" class="form-control score-input"
                                                       th:id="'s2_'+${match.id}" min="0" max="10"
                                                       th:value="${scores[match.id] != null ? scores[match.id][1] : ''}"
                                                       th:attr="data-initial=${scores[match.id] != null ? scores[match.id][1] : ''}">
                                                <span class="fw-bold d-none d-md-inline" th:text="${match.team2?.name}"></span>
                                                <span class="fw-bold d-md-none" th:text="${match.team2?.countryCode}"></span>
                                                <button type="button" class="btn btn-sm border-0 fs-5 px-2 dice-btn"
                                                        title="Randomize this match">
                                                    <i class="bi bi-dice-6"></i>
                                                </button>
                                                <button type="button" class="btn btn-primary btn-sm ms-1 save-btn" disabled
                                                        th:attr="data-match-id=${match.id}">
                                                    <i class="bi bi-check-lg"></i> Save
                                                </button>
                                            </div>
                                        </div>
                                        <div class="text-end mt-1" th:id="'msg_'+${match.id}"></div>
                                    </div>
                                    <div th:unless="${isSelf}" class="text-center py-2">
                                        <div class="d-flex align-items-center justify-content-center gap-2 flex-nowrap">
                                            <span class="fw-bold d-none d-md-inline" th:text="${match.team1?.name}"></span>
                                            <span class="fw-bold d-md-none" th:text="${match.team1?.countryCode}"></span>
                                            <span class="fw-bold fs-5" th:if="${scores[match.id] != null}" th:text="${scores[match.id][0]}"></span>
                                            <span class="text-muted fs-5" th:if="${scores[match.id] == null}">-</span>
                                            <span class="text-muted">&ndash;</span>
                                            <span class="fw-bold fs-5" th:if="${scores[match.id] != null}" th:text="${scores[match.id][1]}"></span>
                                            <span class="text-muted fs-5" th:if="${scores[match.id] == null}">-</span>
                                            <span class="fw-bold d-none d-md-inline" th:text="${match.team2?.name}"></span>
                                            <span class="fw-bold d-md-none" th:text="${match.team2?.countryCode}"></span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:if="${isSelf}">
        function randomScore() {
            const roll = Math.random();
            if (roll < 0.35) return 0;
            if (roll < 0.65) return 1;
            if (roll < 0.83) return 2;
            if (roll < 0.93) return 3;
            if (roll < 0.97) return 4;
            if (roll < 0.985) return 5;
            if (roll < 0.993) return 6;
            if (roll < 0.997) return 7;
            if (roll < 0.999) return 8;
            if (roll < 0.9998) return 9;
            return 10;
        }

        document.querySelectorAll('.save-btn').forEach(btn => {
            const matchId = btn.getAttribute('data-match-id');
            const s1 = document.getElementById('s1_' + matchId);
            const s2 = document.getElementById('s2_' + matchId);
            const msg = document.getElementById('msg_' + matchId);

            function checkDirty() {
                const d1 = s1.value !== s1.getAttribute('data-initial');
                const d2 = s2.value !== s2.getAttribute('data-initial');
                btn.disabled = !(d1 || d2);
            }
            s1.addEventListener('input', checkDirty);
            s2.addEventListener('input', checkDirty);

            const dice = btn.previousElementSibling;
            if (dice && dice.classList.contains('dice-btn')) {
                dice.addEventListener('click', () => {
                    s1.value = randomScore();
                    s2.value = randomScore();
                    checkDirty();
                });
            }

            btn.addEventListener('click', async () => {
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
                msg.innerHTML = '';
                try {
                    const formData = new FormData();
                    formData.append('matchId', matchId);
                    formData.append('team1Score', s1.value);
                    formData.append('team2Score', s2.value);
                    const resp = await fetch('/api/predict/match/save', {
                        method: 'POST',
                        body: formData
                    });
                    const result = await resp.json();
                    if (result.success) {
                        s1.setAttribute('data-initial', s1.value);
                        s2.setAttribute('data-initial', s2.value);
                        msg.innerHTML = '<small class="text-success"><i class="bi bi-check"></i> Saved</small>';
                        setTimeout(() => { msg.innerHTML = ''; }, 2000);
                    } else {
                        msg.innerHTML = '<small class="text-danger">' + result.error + '</small>';
                        btn.disabled = false;
                    }
                } catch (e) {
                    msg.innerHTML = '<small class="text-danger">Failed to save</small>';
                    btn.disabled = false;
                }
                btn.innerHTML = '<i class="bi bi-check-lg"></i> Save';
                checkDirty();
            });
        });
    </script>
</body>
</html>
