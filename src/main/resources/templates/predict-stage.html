<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage Predictions - WC Predictor 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-trophy-fill"></i> WC Predictor 2026</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/predict">Predictions</a></li>
                    <li class="nav-item"><a class="nav-link" href="/simulate">Simulator</a></li>
                    <li class="nav-item"><a class="nav-link" href="/leaderboard">Leaderboard</a></li>
                </ul>
                <span class="navbar-text" sec:authentication="name"></span>
                <span class="badge bg-danger ms-2" th:if="${dummyTimeActive}"><i class="bi bi-cone-striped"></i> DUMMY TIME</span>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex align-items-center gap-2 mb-4">
            <a href="#" onclick="history.back(); return false;" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Back</a>
            <a th:href="@{/player/{id}(id=${target.id})}" class="text-decoration-none"><h3 class="mb-0" th:text="${target.nickname != null && !target.nickname.isBlank() ? target.nickname : (target.firstName != null ? target.firstName + ' ' + target.lastName : target.emailAddress)}"></h3></a>
        </div>

        <div class="d-flex align-items-center gap-3 mb-4">
            <label class="form-label mb-0"><strong>Round:</strong></label>
            <select class="form-select form-select-sm" style="width:auto"
                    onchange="location = '/predict/user/' + document.getElementById('userId').value + '/stage/' + this.value">
                <option value="GROUP_MD1" th:selected="${round.name() == 'GROUP_MD1'}">Matchday 1</option>
                <option value="GROUP_MD2" th:selected="${round.name() == 'GROUP_MD2'}">Matchday 2</option>
                <option value="GROUP_MD3" th:selected="${round.name() == 'GROUP_MD3'}">Matchday 3</option>
            </select>
        </div>
        <input type="hidden" id="userId" th:value="${target.id}">

        <div th:replace="~{fragments/predict-stage-fragment :: stage-matches(matches=${matches}, scores=${scores}, matchLocked=${matchLocked}, isSelf=${isSelf}, allLocked=${allLocked})}"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/match-predictions.js"></script>
</body>
</html>
