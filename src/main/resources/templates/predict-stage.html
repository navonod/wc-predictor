<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage Predictions - WC Predictor 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css">
    <style>
        .score-input-sm { width: 52px !important; text-align: center; font-weight: 700; }
        .save-btn-sm { width: 28px; height: 24px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-trophy-fill"></i> WC Predictor 2026</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/predict">Predictions</a></li>
                    <li class="nav-item"><a class="nav-link" href="/simulate">Simulator</a></li>
                    <li class="nav-item"><a class="nav-link" href="/leaderboard">Leaderboard</a></li>
                </ul>
                <span class="navbar-text" sec:authentication="name"></span>
                <span class="badge bg-danger ms-2" th:if="${dummyTimeActive}"><i class="bi bi-cone-striped"></i> DUMMY TIME</span>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex align-items-center gap-2 mb-4">
            <a href="#" onclick="history.back(); return false;" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Back</a>
            <a th:href="@{/player/{id}(id=${target.id})}" class="text-decoration-none"><h3 class="mb-0" th:text="${target.nickname != null && !target.nickname.isBlank() ? target.nickname : (target.firstName != null ? target.firstName + ' ' + target.lastName : target.emailAddress)}"></h3></a>
        </div>

        <div class="d-flex align-items-center gap-3 mb-4">
            <label class="form-label mb-0"><strong>Round:</strong></label>
            <select class="form-select form-select-sm" style="width:auto"
                    onchange="location = '/predict/user/' + document.getElementById('userId').value + '/stage/' + this.value">
                <option value="GROUP_MD1" th:selected="${round.name() == 'GROUP_MD1'}">Matchday 1</option>
                <option value="GROUP_MD2" th:selected="${round.name() == 'GROUP_MD2'}">Matchday 2</option>
                <option value="GROUP_MD3" th:selected="${round.name() == 'GROUP_MD3'}">Matchday 3</option>
            </select>
        </div>
        <input type="hidden" id="userId" th:value="${target.id}">

        <div th:replace="~{fragments/predict-stage-fragment :: stage-matches}"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:if="${isSelf}">
        function randomScore() {
            const roll = Math.random();
            if (roll < 0.35) return 0; if (roll < 0.65) return 1; if (roll < 0.83) return 2;
            if (roll < 0.93) return 3; if (roll < 0.97) return 4; if (roll < 0.985) return 5;
            if (roll < 0.993) return 6; if (roll < 0.997) return 7; if (roll < 0.999) return 8;
            if (roll < 0.9998) return 9; return 10;
        }

        document.querySelectorAll('.save-btn-sm').forEach(btn => {
            const matchId = btn.getAttribute('data-match-id');
            const s1 = document.getElementById('ss1_' + matchId);
            const s2 = document.getElementById('ss2_' + matchId);
            const msg = document.getElementById('smsg_' + matchId);
            if (!s1 || !s2) return;

            function checkDirty() {
                btn.disabled = !(s1.value !== s1.getAttribute('data-initial') || s2.value !== s2.getAttribute('data-initial'));
            }
            s1.addEventListener('input', checkDirty);
            s2.addEventListener('input', checkDirty);

            const card = btn.closest('.card');
            const dice = card?.querySelector('.dice-btn-sm');
            if (dice) dice.addEventListener('click', () => { s1.value = randomScore(); s2.value = randomScore(); checkDirty(); });

            btn.addEventListener('click', async () => {
                btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm" style="width:12px;height:12px"></span>';
                msg.innerHTML = '';
                try {
                    const formData = new FormData();
                    formData.append('matchId', matchId); formData.append('team1Score', s1.value); formData.append('team2Score', s2.value);
                    const resp = await fetch('/api/predict/match/save', { method: 'POST', body: formData });
                    const result = await resp.json();
                    if (result.success) {
                        s1.setAttribute('data-initial', s1.value); s2.setAttribute('data-initial', s2.value);
                        msg.innerHTML = '<span class="text-success">Saved</span>';
                        setTimeout(() => { msg.innerHTML = ''; }, 2000);
                    } else {
                        msg.innerHTML = '<span class="text-danger">' + result.error + '</span>'; btn.disabled = false;
                    }
                } catch (e) {
                    msg.innerHTML = '<span class="text-danger">Error</span>'; btn.disabled = false;
                }
                btn.innerHTML = '<i class="bi bi-check"></i>'; checkDirty();
            });
        });
    </script>
</body>
</html>
