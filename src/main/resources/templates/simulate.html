<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulator - WC Predictor 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-trophy-fill"></i> WC Predictor 2026</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/predict">Predictions</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/simulate">Simulator</a></li>
                    <li class="nav-item"><a class="nav-link" href="/leaderboard">Leaderboard</a></li>
                </ul>
                <span class="navbar-text" sec:authentication="name"></span>
                <span class="badge bg-danger ms-2" th:if="${dummyTimeActive}"><i class="bi bi-cone-striped"></i> DUMMY TIME</span>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="bi bi-dice-6"></i> Simulator</h2>
            <div>
                <form method="post" th:action="@{/simulate/randomize}" class="d-inline">
                    <button type="submit" class="btn btn-warning"><i class="bi bi-shuffle"></i> Randomize All</button>
                </form>
                <form method="post" th:action="@{/simulate/clear}" class="d-inline ms-2" th:if="${hasSimulation}">
                    <button type="submit" class="btn btn-outline-danger"><i class="bi bi-trash"></i> Clear</button>
                </form>
            </div>
        </div>

        <div th:if="${message}" class="alert alert-info alert-dismissible fade show">
            <span th:text="${message}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <h4 class="mb-3">Group Standings</h4>
        <div class="row g-3 mb-4">
            <div class="col-6 col-sm-4 col-md-3" th:each="entry : ${standings}">
                <div class="card shadow-sm h-100">
                    <div class="card-header bg-dark text-white py-1 px-2 d-flex justify-content-between align-items-center">
                        <small><strong>Group <span th:text="${entry.key}"></span></strong></small>
                        <a th:href="@{/simulate/group/{group}(group=${entry.key})}"
                           class="btn btn-light btn-sm py-0 px-2">Score</a>
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-sm mb-0 small">
                            <thead>
                                <tr><th>#</th><th>Team</th><th>Pts</th><th>GD</th></tr>
                            </thead>
                            <tbody>
                                <tr th:each="gs : ${entry.value}"
                                    th:classappend="${gs.position <= 2} ? 'table-success' : (${gs.position == 3} ? 'table-warning' : '')">
                                    <td th:text="${gs.position}"></td>
                                    <td th:text="${gs.team.name}"></td>
                                    <td th:text="${gs.points}"></td>
                                    <td><span th:if="${gs.goalDiff > 0}">+</span><span th:text="${gs.goalDiff}"></span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${bestThirds != null and !bestThirds.isEmpty()}" class="card shadow-sm mb-4">
            <div class="card-header bg-info text-white py-2">
                <strong>Best 8 Third-Placed Teams</strong>
                <small class="ms-2">(advance to Round of 32)</small>
            </div>
            <div class="card-body p-0">
                <table class="table table-sm mb-0">
                    <thead>
                        <tr><th>#</th><th>Team</th><th>Grp</th><th>Pts</th><th>GD</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="gs, stat : ${bestThirds}">
                            <td th:text="${stat.index + 1}"></td>
                            <td th:text="${gs.team.name}"></td>
                            <td th:text="${gs.groupLetter}"></td>
                            <td th:text="${gs.points}"></td>
                            <td><span th:if="${gs.goalDiff > 0}">+</span><span th:text="${gs.goalDiff}"></span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div th:if="${allRounds != null and !allRounds.isEmpty()}">
            <div th:each="entry : ${allRounds}" th:if="${entry.value != null and !entry.value.isEmpty()}" class="card shadow-sm mb-4">
                <div class="card-header bg-success text-white py-2">
                    <strong th:text="${entry.key.description}"></strong>
                </div>
                <div class="card-body p-0">
                    <table class="table table-sm mb-0">
                        <thead>
                            <tr><th>#</th><th>Date</th><th>Venue</th><th>Home</th><th></th><th>Away</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="m : ${entry.value}">
                                <td th:text="${m.matchNumber}"></td>
                                <td th:text="${#temporals.format(m.matchDate, 'MMM d, HH:mm')}"></td>
                                <td class="small" th:text="${m.venue}"></td>
                                <td th:text="${m.team1Name}"></td>
                                <td class="text-center">vs</td>
                                <td th:text="${m.team2Name}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
