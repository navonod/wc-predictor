<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Predictions - WC Predictor 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-trophy-fill"></i> WC Predictor 2026</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/predict">Predictions</a></li>
                    <li class="nav-item"><a class="nav-link" href="/simulate">Simulator</a></li>
                    <li class="nav-item"><a class="nav-link" href="/leaderboard">Leaderboard</a></li>
                </ul>
                <span class="navbar-text" sec:authentication="name"></span>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4"><i class="bi bi-diagram-3"></i> Group Advancement Predictions</h2>
        <p class="text-muted">Select 32 teams you think will advance: the top 2 from each group (24) + 8 best third-place teams.</p>
        <p class="text-muted"><strong>2 points per correct advancing team.</strong></p>

        <form method="post" th:action>
            <div class="row">
                <div class="col-md-6" th:each="entry : ${groups}">
                    <div class="card shadow-sm mb-3">
                        <div class="card-header">
                            <strong>Group <span th:text="${entry.key}"></span></strong>
                        </div>
                        <div class="card-body">
                            <div class="form-check" th:each="team : ${entry.value}">
                                <input class="form-check-input" type="checkbox" name="teamId"
                                       th:value="${team.id}"
                                       th:checked="${predictedTeamIds.contains(team.id.toString())}">
                                <label class="form-check-label" th:text="${team.name + ' (' + team.fifaCode + ')'}"></label>
                            </div>
                            <small class="text-muted">Select 2-3 teams to advance</small>
                        </div>
                    </div>
                </div>
            </div>

            <div class="text-center mt-3 mb-5">
                <a href="/predict" class="btn btn-outline-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Predictions</button>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
