<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Simulator - WC Predictor 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        .score-input { width: 72px !important; text-align: center; font-size: 1.1rem; font-weight: 700; }
        .match-card .team-name { min-width: 120px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-trophy-fill"></i> WC Predictor 2026</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/predict">Predictions</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/simulate">Simulator</a></li>
                    <li class="nav-item"><a class="nav-link" href="/leaderboard">Leaderboard</a></li>
                </ul>
                <span class="navbar-text" sec:authentication="name"></span>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex align-items-center gap-2 mb-4">
            <a href="/simulate" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i> Back</a>
            <h3 class="mb-0">Group <span th:text="${group}"></span></h3>
        </div>

        <ul class="nav nav-tabs mb-4">
            <li class="nav-item" th:each="r : ${rounds}">
                <a class="nav-link" th:classappend="${selectedRound == r} ? 'active'"
                   th:href="@{/simulate/group/{group}(group=${group}, round=${r})}">
                    <span th:if="${r == 'GROUP_MD1'}">Matchday 1</span>
                    <span th:if="${r == 'GROUP_MD2'}">Matchday 2</span>
                    <span th:if="${r == 'GROUP_MD3'}">Matchday 3</span>
                </a>
            </li>
        </ul>

        <div th:each="match : ${matches}" th:if="${match.round.name() == selectedRound}">
            <div class="row justify-content-center mb-3">
                <div class="col-lg-10">
                    <div class="card shadow-sm match-card">
                        <div class="card-header text-muted small py-1">
                            Match <span th:text="${match.matchNumber}"></span> &middot;
                            <span th:text="${#temporals.format(match.matchDate, 'MMM d, HH:mm')}"></span>
                            <span th:if="${match.venue != null}">&middot; <span th:text="${match.venue}"></span></span>
                        </div>
                        <div class="card-body py-3">
                            <form method="post" th:action="@{/simulate/save}">
                                <input type="hidden" name="matchId" th:value="${match.id}">
                                <input type="hidden" name="redirect"
                                       th:value="@{/simulate/group/{group}(group=${group}, round=${selectedRound})}">
                                <div class="d-flex align-items-center justify-content-center gap-2 flex-wrap">
                                    <span class="team-name text-end fw-bold" th:text="${match.team1.name}"></span>
                                    <input type="number" class="form-control score-input"
                                           name="team1Score" min="0" max="10"
                                           th:value="${scores[match.id] != null ? scores[match.id][0] : ''}"
                                           th:attr="data-initial=${scores[match.id] != null ? scores[match.id][0] : ''}">
                                    <span class="text-muted fs-5 mx-1">&ndash;</span>
                                    <input type="number" class="form-control score-input"
                                           name="team2Score" min="0" max="10"
                                           th:value="${scores[match.id] != null ? scores[match.id][1] : ''}"
                                           th:attr="data-initial=${scores[match.id] != null ? scores[match.id][1] : ''}">
                                    <span class="team-name fw-bold" th:text="${match.team2.name}"></span>
                                    <button type="button" class="btn btn-sm border-0 fs-5 px-2 dice-btn"
                                            title="Randomize this match">
                                        <i class="bi bi-dice-6"></i>
                                    </button>
                                    <button type="submit" class="btn btn-primary btn-sm ms-1 save-btn" disabled
                                            title="Modify scores to enable save">
                                        <i class="bi bi-check-lg"></i> Save
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${matches == null or matches.isEmpty()}" class="text-center text-muted py-5">
            <p>No matches found for this group.</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function randomScore() {
            const roll = Math.random();
            if (roll < 0.35) return 0;
            if (roll < 0.65) return 1;
            if (roll < 0.83) return 2;
            if (roll < 0.93) return 3;
            if (roll < 0.97) return 4;
            if (roll < 0.985) return 5;
            if (roll < 0.993) return 6;
            if (roll < 0.997) return 7;
            if (roll < 0.999) return 8;
            if (roll < 0.9998) return 9;
            return 10;
        }

        document.querySelectorAll('form').forEach(form => {
            const inputs = form.querySelectorAll('.score-input');
            const btn = form.querySelector('.save-btn');
            const dice = form.querySelector('.dice-btn');

            function checkDirty() {
                let dirty = false;
                inputs.forEach(inp => {
                    const current = inp.value;
                    const initial = inp.getAttribute('data-initial');
                    if (current !== initial) dirty = true;
                });
                btn.disabled = !dirty;
            }

            inputs.forEach(inp => inp.addEventListener('input', checkDirty));

            if (dice) {
                dice.addEventListener('click', () => {
                    inputs[0].value = randomScore();
                    inputs[1].value = randomScore();
                    checkDirty();
                });
            }

            form.addEventListener('submit', () => {
                btn.disabled = true;
                btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Saving...';
            });
        });
    </script>
</body>
</html>
