<html>
<head>
    <title>WC2022 Round <?=getCurrentRound() + 1?> Predictions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">
</head>
<body>
    <style>
        .heading {
          text-align: center;
          font-family: Arial, Helvetica, sans-serif;
          font-weight: bold;
          padding-top: 20px
        }
        .dropdown {
          font-family: Arial, Helvetica, sans-serif;
        }
        .match-details {
          text-align: center;
          font-family: Arial, Helvetica, sans-serif;
          font-size: smaller;
          padding-top: 20px;
        }
        .wc-label {
            width: fit-content;
            display: inline;
            font-family: Arial, Helvetica, sans-serif;
        }
        .score {
            width:  2em;
            text-align: center;
        }
        .right {
          justify-content: flex-end;
        }
        .left {
          justify-content: flex-start;
        }
    </style>
    <script>
        function isNumberKey(evt){
            var charCode = (evt.which) ? evt.which : evt.keyCode
            if (charCode > 31 && (charCode < 48 || charCode > 57))
                return false;
            return true;
        }
        
        function handleFormSubmit(data) {
          google.script.run.processPredictScoresForm(data);
          document.getElementById("predictScoresForm").reset();
        }

        function getActionUrl() {
          var url = "<?=getScriptUrl()?>?page=summary&round=<?=getCurrentRound()?>";
          var name = document.getElementById("name").value;
          url = url+"&name="+name;
          return url;
        }

        function updateActionUrl() {
          document.getElementById("predictScoresForm").action.value=getActionUrl();
        }

    </script>
    <form id="predictScoresForm" onsubmit="handleFormSubmit(this)" action="<?=getScriptUrl()?>">
      <input type="hidden" id="roundNumber" name="roundNumber" value="<?=getCurrentRound()+1?>">
      <input type="hidden" id="page" name="page" value="summary">
      <div class="container">
        <div class="row ">
          
          <div class="col-sm-6 text-end">
            <label for="name">Who are you?</label>
          </div>
          <div class="col-sm-6 text-start">
            <?
              let lastColumn = predictionsSheet.getLastColumn()-PREDICTIONS.result+1;
              var names = pinsSheet.getRange(1,1,pinsSheet.getLastRow(),1).getValues().sort();
            ?>
              <select name="name" id="name" onchange="updateActionUrl()">
            <?
              for (var nameArray of names) {
                ?> <option class="dropdown" value="<?=nameArray[0]?>"><?=nameArray[0]?></option> <?
              }
            ?>
              </select>
          </div>
        </div>

        <div class="row">
          <div class="col-sm-6 text-end">
            <label for="pin">What's your PIN?</label>
          </div>
          <div class="col-sm-6 text-start">
            <input type="text" size="4em" name="pin"/>
          </div>
        </div>

        <div class="row">
          <div class="col-sm-12 text-center">
            Round <?= getCurrentRound()+1 ?> Predictions
          </div>
        </div>

        <?
          var data = pointsSheet.getRange('A3:J72').getValues().filter(row => row[POINTS.round-1] == getCurrentRound()+1);
          for (var count = 0; count < data.length; count++) {
            let match = data[count];
            var options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            ?>
              <div class="row">
                <div class="col-sm-12 text-center">
                  Match <?=match[POINTS.match-1]?> | <?=match[POINTS.date-1].toLocaleDateString("en-US", options);?>
                </div>
              </div>

              <div class="row">
                  <div class="col-sm-4 text-end">
                    <label class="wc-label" for="match-<?= match[POINTS.match-1] ?>-team-1"><?= match[POINTS.team1-1] ?></label>
                  </div>
                  <div class="col-sm-4 text-center">
                    <input name="match-<?= match[POINTS.match-1] ?>-team-1" type="text" onkeypress="return isNumberKey(event)" maxlength="2" class="score"/> vs <input name="match-<?= match[POINTS.match-1] ?>-team-2" type="text" onkeypress="return isNumberKey(event)" maxlength="2" class="score"/>
                  </div>

                  <div class="col-sm-4 text-start">
                    <label class="wc-label" for="match-<?= match[POINTS.match-1] ?>-team-2"><?= match[POINTS.team2-1] ?></label>
                  </div>
              </div>
            <?
          }
        ?>
        <div class="row">
          <div class="col-sm-12">
            <input type="submit" value="Submit">
          </div>
        </div>
      </div>

    </form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3" crossorigin="anonymous"></script>
</body>
</html>
