services:
  wcpredictor:
    build: .
    ports:
      - "127.0.0.1:1986:8090"
    volumes:
      - wcdata:/app/data
    environment:
      SPRING_PROFILES_ACTIVE: prod
      APP_BASE_URL: https://wc.thatcher.africa
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
    restart: unless-stopped

volumes:
  wcdata:
